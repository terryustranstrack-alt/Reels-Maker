# Packaging settings for the Windows installer (electron-builder).
appId: id.racikdigital.reels
productName: Racik Reels
copyright: Copyright © Racik Digital

directories:
  output: dist-desktop

# The app window code only; everything else comes from the bundled server below.
files:
  - desktop/electron-main.cjs
  - package.json
  - "!node_modules/**"

# The local server (Next.js standalone build, includes FFmpeg and caption fonts).
extraResources:
  - from: .next/standalone
    to: server
    filter:
      - "**/*"
      - "**/.next/**"
  # Listed on its own: the packager skips node_modules folders inside the entry above.
  - from: .next/standalone/node_modules
    to: server/node_modules
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Racik Reels
  artifactName: Racik-Reels-Setup-${version}.exe
