# Packaging settings for the Windows installer (electron-builder).
appId: id.racikdigital.reels
productName: Racik Reels
copyright: Copyright © Racik Digital

directories:
  output: dist-desktop

# The app window code only; everything else comes from the bundled server below.
files:
  - desktop/electron-main.cjs
  - package.json
  - "!node_modules/**"

# The local server (Next.js standalone build, includes FFmpeg and caption fonts).
extraResources:
  - from: .next/standalone
    to: server
    filter:
      - "**/*"
      - "**/.next/**"
  # Listed on its own: the packager skips node_modules folders inside the entry above.
  - from: .next/standalone/node_modules
    to: server/node_modules
    filter:
      - "**/*"
  # Whisper speech recognition (downloaded by `npm run desktop:download-whisper`).
  - from: vendor/whisper
    to: whisper
  - from: vendor/whisper-models
    to: whisper-models

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  # Unzip straight into the install folder. The default (7z + copy step) failed on Windows with a
  # misleading "Racik Reels cannot be closed" error; this path also shows the real reason if a file is blocked.
  useZip: true
  differentialPackage: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Racik Reels
  artifactName: Racik-Reels-Setup-${version}.exe
